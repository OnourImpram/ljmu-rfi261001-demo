name: Reference quality checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ljmu-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax, regression and source checks
        run: |
          for source in js/*.js; do node --check "$source"; done
          npm test
          python tests/check_source.py
      - name: Stage the public files
        run: python tests/pages_site.py stage "$RUNNER_TEMP/ljmu-pages"
      - name: Browser dependencies
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test browser workflows and responsive layouts against the staged site
        env:
          SITE_ROOT: ${{ runner.temp }}/ljmu-pages
        run: python tests/browser_smoke.py
      - name: Upload the tested Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ${{ runner.temp }}/ljmu-pages
          include-hidden-files: true
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested artifact
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: deploy
    uses: ./.github/workflows/live-verification.yml
    with:
      page_url: ${{ needs.deploy.outputs.page_url }}
